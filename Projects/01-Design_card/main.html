<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>CSS card Design</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Mea+Culpa&display=swap');

        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: gray;
            padding: 200px;
        }

        .card {
            background-color: white;
            width: 400px;
            height: 644px;
            border-radius: 7px;
        }

        .img {
            padding: 10px;
        }

        .img img {
            border-radius: 7px;
        }

        .content {
            padding: 7px 14px;
        }


        .content p {
            font-size: 17px;
            padding-top: 10px;
            width: 300px;
            padding-left: 40px;
            color: rgba(11, 11, 11, 0.516);
        }

        .content h2 {
            font-size: 30px;
            padding-left: 25px;
        }

        .caosules {
            padding-left: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .caosules button {

            font-family: "Baloo Bhai 2", sans-serif;
            border: 1px solid rgb(255, 254, 254);
            background-color: rgba(218, 214, 214, 0.851);
            color: rgb(0, 0, 0);
            border-radius: 20px;
            margin-right: 20px;
            padding: 4px 12px;
            font-size: 15px;

        }

        .caosules button:hover {
            background-color: whitesmoke;
            box-shadow: 1px 1px 2px rgb(82, 81, 81);
           }

        .end{
            padding: 25px 156px;
 }

        .read{
            width: 90px;
            height: 40px;
            font-size: medium;
            border-radius: 15px;
            border: 1px solid rgb(122, 121, 121);
        }

        .end button:hover{
             background-color: whitesmoke;
            box-shadow: 1px 1px 2px rgb(82, 81, 81);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="img">
            <img src="image.png" width="380pxpx" height="250px">
        </div>

        <div class="caosules">
            <button>Nature</button>
            <button>Lake</button>
        </div>
        <div class="content">
            <h2>Lorem,</h2>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Molestias ipsam molestiae asperiores hic, atque
                aut minima quas minus. A odit voluptatibus beatae ipsa ipsam deleniti provident. Sapiente architecto
                eius doloremque, suscipit sequi error vitae.</p>
        </div>

        <div class="end">
            <button class="read">read more</button>
        </div>
    </div>
</body>

</html>
